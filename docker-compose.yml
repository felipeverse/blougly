services:
    blougly:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                UID: "${UID:-1000}"
                GID: "${GID:-1000}"
        init: true
        volumes:
            - .:/blougly
        working_dir: /blougly
        command: php bin/console.php
        container_name: blougly
        environment:
            XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003"
        extra_hosts:
            - "host.docker.internal:host-gateway"
